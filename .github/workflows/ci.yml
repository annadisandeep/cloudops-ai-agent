name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest) — Gemini and cloud SDKs are mocked; demo mode only
        env:
          CLOUDOPS_DEMO_MODE: "true"
          CLOUDOPS_LLM_PROVIDER: "mock"
        run: pytest tests -q

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Production build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cloudops-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t cloudops-frontend:ci ./frontend

  terraform:
    name: Terraform — fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: terraform fmt
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - name: terraform validate (no backend, no credentials, nothing provisioned)
        working-directory: infrastructure/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

# CloudOps AI Agent — local stack (demo mode, no cloud credentials required)
# Usage: docker compose up --build  →  http://localhost:8080
services:
  backend:
    build: ./backend
    environment:
      CLOUDOPS_DEMO_MODE: "true"
      CLOUDOPS_LLM_PROVIDER: "mock"
      # Frontend is served same-origin via nginx; CORS only needed for dev servers.
      CLOUDOPS_CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      # To enable Gemini: set CLOUDOPS_LLM_PROVIDER=gemini and provide the key
      # via an env file or secret manager — never commit it.
      # CLOUDOPS_GEMINI_API_KEY: ${CLOUDOPS_GEMINI_API_KEY}
    volumes:
      - cloudops-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  cloudops-data:
